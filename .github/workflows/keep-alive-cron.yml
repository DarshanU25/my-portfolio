name: Render Backend Keep-Alive Ping

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Ping
        run: |
          TARGET_URL="${{ secrets.RENDER_BACKEND_URL || 'https://your-backend-app.onrender.com' }}"
          echo "Pinging: $TARGET_URL/api/ping"
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}\nLATENCY:%{time_total}s\n" "$TARGET_URL/api/ping" || true)
          echo "$RESPONSE"
